<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Планировщик Терра</title>

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Планировщик Терра"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="theme-color"
    content="#123d7a"
  >


  <!-- ВАЖНО:
       manifest здесь специально НЕ подключаем -->


  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./terra-icon-v2-180.png?v=3"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./terra-icon-v2-192.png?v=3"
  >


  <style>

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      width:100%;
      min-height:100%;
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      color:#17345f;
    }


    body {

      min-height:100vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:24px;

    }


    .card {

      width:100%;

      max-width:420px;

      background:white;

      border-radius:22px;

      padding:28px 22px;

      text-align:center;

      box-shadow:
        0 8px 30px rgba(22,52,95,.12);

    }


    .icon {

      display:block;

      width:110px;

      height:110px;

      margin:
        0 auto 18px;

      border-radius:24px;

    }


    h1 {

      margin:
        0 0 12px;

      font-size:26px;

      color:#123d7a;

    }


    .text {

      margin:0;

      font-size:16px;

      line-height:1.5;

      color:#64748b;

    }


    .instruction {

      margin-top:18px;

      padding:14px 15px;

      border-radius:14px;

      background:#edf6ec;

      color:#2f7236;

      font-size:14px;

      line-height:1.45;

      font-weight:700;

    }


    .button {

      width:100%;

      min-height:52px;

      margin-top:18px;

      border:0;

      border-radius:13px;

      background:#123d7a;

      color:white;

      font-size:16px;

      font-weight:800;

    }


    .error {

      margin-top:16px;

      color:#b52a35;

      font-weight:700;

    }

  </style>

</head>


<body>


  <div class="card">


    <img
      class="icon"
      src="./terra-icon-v2-192.png?v=3"
      alt="Планировщик Терра"
    >


    <h1>
      Планировщик Терра
    </h1>


    <p
      class="text"
      id="status"
    >
      Проверяем персональную ссылку…
    </p>


    <div
      class="instruction"
      id="instruction"
    >

      На iPhone нажмите
      «Поделиться» →
      «На экран Домой».

    </div>


    <button
      class="button"
      id="openButton"
      type="button"
      onclick="openPlanner()"
    >

      Открыть Планировщик

    </button>


  </div>


  <script>


    const APP_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbwKVkjnyGNPHg761ilsD39Y9MpSqZnOOCoWfNt9gS3n2IM827S2XDruOnYtUf78fz3LrA/exec';


    const params =
      new URLSearchParams(
        window.location.search
      );


    const token =
      String(
        params.get('token') || ''
      ).trim();


    const status =
      document.getElementById(
        'status'
      );


    const instruction =
      document.getElementById(
        'instruction'
      );


    const openButton =
      document.getElementById(
        'openButton'
      );


    function getPlannerUrl() {

      return (
        APP_SCRIPT_URL +
        '?token=' +
        encodeURIComponent(token)
      );

    }


    function openPlanner() {

      if (!token) {
        return;
      }


      window.location.href =
        getPlannerUrl();

    }


    function isStandalone() {

      return (
        window.navigator.standalone === true
      );

    }


    if (!token) {


      status.textContent =
        'Ссылка недействительна: отсутствует персональный токен.';


      status.className =
        'error';


      instruction.style.display =
        'none';


      openButton.style.display =
        'none';


    } else {


      status.textContent =
        'Персональная ссылка подключена.';


      /*
        Если страницу открыли уже
        через ярлык на экране iPhone,
        сразу запускаем Планировщик.
      */

      if (
        isStandalone()
      ) {


        status.textContent =
          'Открываем Планировщик…';


        instruction.style.display =
          'none';


        openButton.style.display =
          'none';


        setTimeout(
          function() {

            openPlanner();

          },
          500
        );

      }

    }


  </script>


</body>

</html>
