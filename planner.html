<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#123d7a"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Терра"
  >

  <title>Планировщик Терра</title>


  <link
    rel="manifest"
    href="./planner-manifest.json"
  >


  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./terra-icon-v2-180.png"
  >


  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./terra-icon-v2-192.png"
  >


  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>


  <style>

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      background:#f4f7fb;
      font-family:Arial,sans-serif;
      color:#17345f;
    }

    .page {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .card {
      width:100%;
      max-width:440px;
      background:white;
      border-radius:22px;
      padding:25px 20px 22px;
      box-shadow:0 6px 25px rgba(0,0,0,.10);
      text-align:center;
    }

    .logo {
      width:90px;
      height:90px;
      margin:0 auto 14px;
      border-radius:20px;
      object-fit:cover;
    }

    h1 {
      margin:0;
      font-size:25px;
      color:#123d7a;
    }

    .subtitle {
      margin-top:7px;
      font-size:15px;
      color:#68788c;
      line-height:1.4;
    }

    .mode {
      display:none;
      margin:14px auto 0;
      width:max-content;
      max-width:100%;
      padding:7px 11px;
      border-radius:20px;
      background:#edf4ff;
      color:#145da8;
      font-size:13px;
      font-weight:800;
    }

    .mode.control {
      display:block;
    }

    .buttons {
      margin-top:22px;
      display:grid;
      gap:10px;
    }

    button {
      width:100%;
      min-height:50px;
      border:0;
      border-radius:13px;
      font-family:inherit;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .open-button {
      background:#123d7a;
      color:white;
    }

    .push-button {
      background:#168357;
      color:white;
    }

    .push-button:disabled {
      opacity:.55;
      cursor:default;
    }

    .hint {
      margin-top:17px;
      color:#7b8798;
      font-size:13px;
      line-height:1.45;
    }

    .status {
      margin-top:13px;
      min-height:18px;
      color:#64758b;
      font-size:13px;
      line-height:1.4;
    }

    .error {
      color:#b52a35;
    }

    .success {
      color:#168357;
      font-weight:700;
    }

  </style>

</head>


<body>

<div class="page">

  <div class="card">

    <img
      class="logo"
      src="./terra-icon-v2-192.png"
      alt="Терра"
    >


    <h1>
      Планировщик Терра
    </h1>


    <div
      class="subtitle"
      id="subtitle"
    >
      Мобильный планировщик задач
    </div>


    <div
      class="mode"
      id="controlMode"
    >
      👁 Режим контроля
    </div>


    <div class="buttons">

      <button
        class="push-button"
        id="pushButton"
        type="button"
      >
        🔔 Включить уведомления
      </button>


      <button
        class="open-button"
        id="openButton"
        type="button"
      >
        Открыть Планировщик
      </button>

    </div>


    <div
      class="status"
      id="status"
    ></div>


    <div
      class="hint"
      id="hint"
    ></div>

  </div>

</div>


<script>

  const APP_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbwKVkjnyGNPHg761ilsD39Y9MpSqZnOOCoWfNt9gS3n2IM827S2XDruOnYtUf78fz3LrA/exec';


  const ONESIGNAL_APP_ID =
    '5b1ce8ac-9f13-4f9e-b297-5c1ad3e35c0a';


  const ONESIGNAL_SAFARI_WEB_ID =
    'web.onesignal.auto.235723f6-f2ef-49f2-bb5e-e966332d4e54';


  const STORAGE_TOKEN =
    'terra_planner_token_v1';


  const STORAGE_MODE =
    'terra_planner_mode_v1';


  const params =
    new URLSearchParams(
      window.location.search
    );


  const urlToken =
    String(
      params.get(
        'token'
      ) || ''
    ).trim();


  const urlMode =
    String(
      params.get(
        'mode'
      ) || ''
    )
      .trim()
      .toLowerCase();


  if (
    urlToken
  ) {

    localStorage.setItem(
      STORAGE_TOKEN,
      urlToken
    );
  }


  if (
    urlMode
  ) {

    localStorage.setItem(
      STORAGE_MODE,
      urlMode
    );
  }


  const TOKEN =
    urlToken ||
    String(
      localStorage.getItem(
        STORAGE_TOKEN
      ) || ''
    ).trim();


  const MODE =
    urlMode ||
    String(
      localStorage.getItem(
        STORAGE_MODE
      ) || ''
    )
      .trim()
      .toLowerCase();


  const IS_CONTROL =
    MODE ===
      'control';


  const statusBox =
    document.getElementById(
      'status'
    );


  const hintBox =
    document.getElementById(
      'hint'
    );


  const pushButton =
    document.getElementById(
      'pushButton'
    );


  const openButton =
    document.getElementById(
      'openButton'
    );


  const controlMode =
    document.getElementById(
      'controlMode'
    );


  const subtitle =
    document.getElementById(
      'subtitle'
    );


  if (
    IS_CONTROL
  ) {

    controlMode
      .classList
      .add(
        'control'
      );


    subtitle.textContent =
      'Просмотр задач компании';
  }


  function isStandalone() {

    return (
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches ||

      window.navigator.standalone ===
        true
    );
  }


  function isIOS() {

    return /iphone|ipad|ipod/i
      .test(
        navigator.userAgent
      );
  }


  function getPlannerUrl() {

    if (
      !TOKEN
    ) {

      return APP_SCRIPT_URL;
    }


    const url =
      new URL(
        APP_SCRIPT_URL
      );


    url.searchParams.set(
      'token',
      TOKEN
    );


    if (
      IS_CONTROL
    ) {

      url.searchParams.set(
        'mode',
        'control'
      );
    }


    return url.toString();
  }


  function showStatus(
    text,
    type
  ) {

    statusBox.textContent =
      text || '';


    statusBox.classList.remove(
      'error',
      'success'
    );


    if (
      type
    ) {

      statusBox
        .classList
        .add(
          type
        );
    }
  }


  function updateHint() {

    if (
      !TOKEN
    ) {

      hintBox.textContent =
        'В этой ссылке отсутствует персональный токен доступа.';

      return;
    }


    if (
      isIOS() &&
      !isStandalone()
    ) {

      hintBox.textContent =
        'На iPhone для полноценной работы уведомлений добавьте Терру на экран «Домой» через меню «Поделиться».';

      return;
    }


    if (
      IS_CONTROL
    ) {

      hintBox.textContent =
        'Это ваш личный контрольный доступ. Не передавайте эту ссылку сотрудникам.';

      return;
    }


    hintBox.textContent =
      'Персональная мобильная версия Планировщика.';
  }


  openButton
    .addEventListener(
      'click',
      function() {

        if (
          !TOKEN
        ) {

          showStatus(
            'Нет токена доступа.',
            'error'
          );

          return;
        }


        window.location.href =
          getPlannerUrl();
      }
    );


  window.OneSignalDeferred =
    window.OneSignalDeferred ||
    [];


  window.OneSignalDeferred.push(
    async function(
      OneSignal
    ) {

      try {

        await OneSignal.init({

          appId:
            ONESIGNAL_APP_ID,

          safari_web_id:
            ONESIGNAL_SAFARI_WEB_ID,

          notifyButton: {
            enable:false
          },

          serviceWorkerPath:
            '/terra-planner-assets/OneSignalSDKWorker.js',

          serviceWorkerParam: {
            scope:
              '/terra-planner-assets/'
          }

        });


        /*
          Для контрольного аккаунта
          закрепляем подписку за отдельным ID.

          Для сотрудников это сделаем
          отдельным следующим этапом.
        */

        if (
          IS_CONTROL
        ) {

          try {

            await OneSignal.login(
              'terra:control'
            );

          } catch (error) {

            console.log(
              'OneSignal login:',
              error
            );
          }
        }


        const permission =
          OneSignal.Notifications
            .permission;


        if (
          permission
        ) {

          pushButton.textContent =
            '✓ Уведомления включены';


          showStatus(
            'Push-уведомления разрешены.',
            'success'
          );
        }


        pushButton
          .addEventListener(
            'click',
            async function() {

              pushButton.disabled =
                true;


              showStatus(
                'Подключаем уведомления…'
              );


              try {

                await OneSignal
                  .Notifications
                  .requestPermission();


                try {

                  await OneSignal
                    .User
                    .PushSubscription
                    .optIn();

                } catch (error) {

                  console.log(
                    'OneSignal optIn:',
                    error
                  );
                }


                if (
                  IS_CONTROL
                ) {

                  try {

                    await OneSignal.login(
                      'terra:control'
                    );

                  } catch (error) {

                    console.log(
                      'OneSignal login:',
                      error
                    );
                  }
                }


                if (
                  OneSignal.Notifications
                    .permission
                ) {

                  pushButton.textContent =
                    '✓ Уведомления включены';


                  showStatus(
                    'Уведомления успешно включены.',
                    'success'
                  );

                } else {

                  showStatus(
                    'Разрешение на уведомления не выдано.',
                    'error'
                  );
                }

              } catch (error) {

                showStatus(
                  error &&
                  error.message
                    ? error.message
                    : 'Не удалось включить уведомления.',
                  'error'
                );

              } finally {

                pushButton.disabled =
                  false;
              }
            }
          );

      } catch (error) {

        showStatus(
          'OneSignal пока не подключён: ' +
          (
            error &&
            error.message
              ? error.message
              : String(
                  error
                )
          ),
          'error'
        );
      }
    }
  );


  updateHint();

</script>

</body>

</html>
